{% extends 'base.html' %}
{% block title %} – Autentificare{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
            <h2 class="fw-bold">MedTrack</h2>
            <p class="text-muted">Gestionează-ți tratamentul simplu</p>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h5 class="card-title mb-4">Autentificare</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-envelope text-muted"></i>
                            </span>
                            <input type="email" name="email" class="form-control border-start-0" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium">Parolă</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock text-muted"></i>
                            </span>
                            <input type="password" name="password" class="form-control border-start-0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Autentificare
                    </button>
                </form>
                <hr>
                <p class="text-center mb-0 text-muted small">
                    Nu ai cont? <a href="{{ url_for('register') }}" class="fw-medium">Înregistrare</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
